name: Materialize health management and HIT capacity files

on:
  push:
    paths:
      - "scripts/materialize_health_management_hit.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Materialize files
        run: python scripts/materialize_health_management_hit.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/capacity/normalized/*/capacities-health-management-hit.csv data/capacity/HEALTH_MANAGEMENT_HIT_SUMMARY.json data/capacity/HEALTH_MANAGEMENT_HIT_REPORT.md
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Add health management and HIT capacities for 1401-1404"
          git push
