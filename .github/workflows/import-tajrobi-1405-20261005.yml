name: Import Tajrobi 1405 PDFs

on:
  push:
    paths:
      - ".github/workflows/import-tajrobi-1405-20261005.yml"

permissions:
  contents: write

jobs:
  import-pdfs:
    runs-on: ubuntu-latest
    env:
      PART1_URL: "https://uc247a725da06f9975a8ee426592.dl.dropboxusercontent.com/cd/0/get/DJa9FxvVFd25okqV5SdTnGVBzrak4hQuS_oiabbR-wkaUhc7flzMcw1F2y9UPHR2J_2i50eEsqIJdX_Wy7ubAvyJ8rSzGy93UOYhPLKyrUBW7M3C5QsgLOEKpHY3FiAm6xO822sYd66VOk2235sf6ZoSCVw8xoHpPirr2gUGddTumQ/file?c_luid=e2a8d15f"
      PART2_URL: "https://ucb399570c720a066aeb0da54a9f.dl.dropboxusercontent.com/cd/0/get/DJbczD49UvLVFFyXx7v49J5ob80eY0Pomvo_D6bbG8frYbhPhaFFwtTgk6H3LJuQ9TUMRU7kgfQ2Z7U-7Iu8J-0WfdSAn8sAKfZkvvjF55x4-DYqRxfAcnuxa-UyhWElnYYoCUIg1JtmVziPgRUZy0vXCIY1wln045LVoAUyvEFrSw/file?c_luid=e2a8d15f"
      DEST_DIR: "data/raw/sanjesh/experimental/1405"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download PDFs from Dropbox
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DEST_DIR"
          curl --fail --location --silent --show-error "$PART1_URL" -o "$DEST_DIR/Tajrobi_part_1.pdf"
          curl --fail --location --silent --show-error "$PART2_URL" -o "$DEST_DIR/Tajrobi_part_2.pdf"

      - name: Verify checksums
        shell: bash
        run: |
          set -euo pipefail
          echo "aa1e065f5434e0fbc2f56ef89b1d9439e4ad72a90a600fb395782f653fcca316  $DEST_DIR/Tajrobi_part_1.pdf" | sha256sum -c -
          echo "338857c01260aee0b47be832d8e5ccf96b3eff4a0d550ef96ab3bd9be967bdac  $DEST_DIR/Tajrobi_part_2.pdf" | sha256sum -c -

      - name: Commit PDFs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST_DIR/Tajrobi_part_1.pdf" "$DEST_DIR/Tajrobi_part_2.pdf"
          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
            exit 0
          fi
          git commit -m "data: add split 1405 experimental booklet PDFs"
          git push
