name: Import 1405 experimental capacities
on:
  push:
    paths:
      - ".github/workflows/import-capacity-1405-20261005.yml"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download extracted 1405 capacities
        env:
          SOURCE_URL: "https://ucfae42fb6d2546058ff49d1aa21.dl.dropboxusercontent.com/cd/0/get/DJbTfTQr_YcrlyusS-gXaBDaKdyhZ-OyZfdbRcSjy9dD0q4u6X_1Nk5CsX_wK4imu8wD0KqUjI4hbGJM3-qzPjWgH5oJmDFI7_OmXFVrux2GC-J6evsCsINyjiKm70oHiqDmkCsaVt27rRbSHHMR3YlAsNkik8JmiRJdwCExFj1NzA/file?c_luid=e2a8d15f"
        run: |
          set -euo pipefail
          mkdir -p data/capacity/normalized/1405 data/capacity/raw/1405
          curl --fail --location --silent --show-error "$SOURCE_URL" -o data/capacity/normalized/1405/capacities-1405-experimental.csv
          echo "1dbc4ccb758029487009b081a2674eef9b1718105515678d5bdc0ce0cb37888b  data/capacity/normalized/1405/capacities-1405-experimental.csv" | sha256sum -c -
          cp data/capacity/normalized/1405/capacities-1405-experimental.csv data/capacity/normalized/1405/capacities-all.csv
          cat > data/capacity/raw/1405/sources.json <<'JSON'
          {
            "year": 1405,
            "group": "experimental",
            "source_id": "1405-booklet",
            "original": "Tajrobi.pdf",
            "pages": 664,
            "sha256": "e9f6d83e0be75e62a5b240dfcbf66856ba0d9c575e762a04fbb610b545618756",
            "repository_parts": [
              {"path":"data/raw/sanjesh/experimental/1405/Tajrobi_part_1.pdf","sha256":"aa1e065f5434e0fbc2f56ef89b1d9439e4ad72a90a600fb395782f653fcca316"},
              {"path":"data/raw/sanjesh/experimental/1405/Tajrobi_part_2.pdf","sha256":"338857c01260aee0b47be832d8e5ccf96b3eff4a0d550ef96ab3bd9be967bdac"}
            ],
            "extraction": {
              "rows": 3900,
              "capacity": 56662,
              "major_families": 39,
              "scope": "Existing experimental major families used by the Flow capacity explorer; unsupported booklet majors are not included in this supplemental export.",
              "page_numbering": "PDF pages, 1-based",
              "includes_medical_dental_1406_start_codes": true
            }
          }
          JSON
          if ! grep -q '^1405-booklet,' data/capacity/raw/sources.csv; then
            printf '%s\n' '1405-booklet,1405,Tajrobi.pdf,booklet,نسخه ارسالی کاربر,e9f6d83e0be75e62a5b240dfcbf66856ba0d9c575e762a04fbb610b545618756,,فایل اصلی به دو بخش در data/raw/sanjesh/experimental/1405 نگهداری می‌شود؛ داده ظرفیت ۱۴۰۵ تجربی در normalized/1405 ثبت شده است.' >> data/capacity/raw/sources.csv
          fi
      - name: Commit data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/capacity/normalized/1405 data/capacity/raw/1405 data/capacity/raw/sources.csv
          git commit -m "data: add 1405 experimental capacity dataset"
          git push
