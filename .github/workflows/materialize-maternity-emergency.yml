name: Materialize maternity and emergency capacity CSVs

on:
  push:
    paths:
      - "scripts/materialize_maternity_emergency.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Materialize CSV files
        run: python scripts/materialize_maternity_emergency.py
      - name: Commit generated capacity files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/capacity/normalized/*/capacities-maternity-emergency.csv
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Materialize midwifery and prehospital emergency capacities"
          git push
