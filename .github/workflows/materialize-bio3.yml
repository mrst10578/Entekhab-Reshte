name: Materialize plant food vetlab capacity files

on:
  push:
    paths:
      - "scripts/materialize_bio3_part1.py"
      - "scripts/materialize_bio3_part2.py"
      - "scripts/materialize_bio3_part3.py"
      - ".github/workflows/materialize-bio3.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Materialize outputs
        run: |
          python scripts/materialize_bio3_part1.py
          python scripts/materialize_bio3_part2.py
          python scripts/materialize_bio3_part3.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/capacity/normalized/1401/capacities-plant-food-vetlab.csv
          git add data/capacity/normalized/1402/capacities-plant-food-vetlab.csv
          git add data/capacity/normalized/1403/capacities-plant-food-vetlab.csv
          git add data/capacity/normalized/1404/capacities-plant-food-vetlab.csv
          git add data/capacity/BIOLOGY_PLANT_FOOD_VETLAB_REPORT.md
          git add data/capacity/BIOLOGY_PLANT_FOOD_VETLAB_SUMMARY.json
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Add plant biology food hygiene and veterinary lab capacities"
          git push
