name: Merge Gozine2 rank admissions

on:
  push:
    branches:
      - data/gozine2-642
    paths:
      - 'data/raw/gozine2/**'
      - 'scripts/merge_gozine2_rank_admissions.py'
      - '.github/workflows/merge-gozine2-rank-admissions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/gozine2-642
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge Gozine2 into yearly rank admissions
        run: python scripts/merge_gozine2_rank_admissions.py
      - name: Validate generated CSVs
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          years=[1397,1398,1399,1400,1402]
          fields=['سال','گروه آزمایشی','رتبه کشوری','رتبه در سهمیه','سهمیه','رشته قبولی','دانشگاه قبولی']
          for y in years:
              p=Path(f'data/rank_admissions/rank_to_admission_{y}.csv')
              assert p.exists(), p
              with p.open(encoding='utf-8-sig',newline='') as f:
                  r=csv.DictReader(f)
                  assert r.fieldnames==fields, (y,r.fieldnames)
                  rows=list(r)
                  assert all(str(x['سال']).strip()==str(y) for x in rows)
                  ranks=[int(x['رتبه در سهمیه']) for x in rows if str(x['رتبه در سهمیه']).isdigit()]
                  assert ranks, y
          rp=Path('reports/data-system/GOZINE2_642_MERGE_REPORT.json')
          data=json.loads(rp.read_text(encoding='utf-8'))
          assert data['totals']['gozine2_source_rows']==642, data['totals']
          print(json.dumps(data['totals'],ensure_ascii=False,indent=2))
          PY
      - name: Commit generated merged datasets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/rank_admissions reports/data-system/GOZINE2_642_MERGE_REPORT.*
          if git diff --cached --quiet; then
            echo 'No generated changes to commit'
          else
            git commit -m 'data: merge 642 recovered Gozine2 admissions'
            git push origin HEAD:data/gozine2-642
          fi
