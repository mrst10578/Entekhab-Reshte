              base=Path("data/raw/kanoon/math")/year
              required={"region-1.jsonl","region-1.manifest.json","region-2.jsonl","region-2.manifest.json","region-3.jsonl","region-3.manifest.json","stage-summary.json","QA_REPORT.json"}
              assert {p.name for p in base.iterdir()}==required
              for p in base.glob("*.json"):
                  json.loads(p.read_text(encoding="utf-8"))
              assert Path(f"reports/data-system/MATH_{year}_COMPLETION_REPORT.md").exists()
          print("VALIDATION_PASS")
          PY
