      - name: Validate imported files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          counts = {
            "data/raw/kanoon/math/1401/region-1.jsonl":1362,
            "data/raw/kanoon/math/1401/region-2.jsonl":3825,
            "data/raw/kanoon/math/1401/region-3.jsonl":2279,
            "data/raw/kanoon/math/1402/region-1.jsonl":408,
            "data/raw/kanoon/math/1402/region-2.jsonl":721,
            "data/raw/kanoon/math/1402/region-3.jsonl":409,
            "data/raw/kanoon/math/1403/region-1.jsonl":406,
            "data/raw/kanoon/math/1403/region-2.jsonl":889,
            "data/raw/kanoon/math/1403/region-3.jsonl":516,
            "data/raw/kanoon/math/1404/region-1.jsonl":497,
            "data/raw/kanoon/math/1404/region-2.jsonl":793,
            "data/raw/kanoon/math/1404/region-3.jsonl":603,
          }
          for name, expected in counts.items():
            rows=[]
            with open(name,encoding="utf-8") as f:
              for line in f:
                if line.strip():
                  rows.append(json.loads(line))
            assert len(rows)==expected,(name,len(rows),expected)
            # ensure exact duplicate fingerprints are absent if present
            fps=[r.get("fingerprint") for r in rows if r.get("fingerprint")]
            assert len(fps)==len(set(fps)), f"duplicate fingerprint: {name}"
          for year in (1401,1402,1403,1404):
            base=Path(f"data/raw/kanoon/math/{year}")
