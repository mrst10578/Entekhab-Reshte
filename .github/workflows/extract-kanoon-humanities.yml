name: Extract Kanoon humanities 1401-1404

on:
  push:
    branches:
      - data/kanoon-humanities-1401-1404-20260928
    paths:
      - ".github/workflows/extract-kanoon-humanities.yml"
      - "scripts/extract_kanoon_humanities.py"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        year: [1401, 1402, 1403, 1404]
        region: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/kanoon-humanities-1401-1404-20260928
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Extract humanities dataset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "staging/humanities/${{ matrix.year }}"
          python scripts/extract_kanoon_humanities.py \
            --year "${{ matrix.year }}" \
            --region "${{ matrix.region }}" \
            --out "staging/humanities/${{ matrix.year }}"

      - name: Pack region output
        shell: bash
        run: |
          set -euo pipefail
          tar -czf artifact.tar.gz \
            -C "staging/humanities/${{ matrix.year }}" \
            "region-${{ matrix.region }}.jsonl" \
            "region-${{ matrix.region }}.manifest.json"

      - uses: actions/upload-artifact@v4
        with:
          name: humanities-${{ matrix.year }}-r${{ matrix.region }}
          path: artifact.tar.gz
          if-no-files-found: error
          retention-days: 7

  aggregate:
    runs-on: ubuntu-latest
    needs: extract
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/kanoon-humanities-1401-1404-20260928
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          pattern: humanities-*
          path: artifacts

      - name: Rehydrate extracted files
        shell: bash
        run: |
          set -euo pipefail
          for year in 1401 1402 1403 1404; do
            mkdir -p "staging/humanities/$year"
            for region in 1 2 3; do
              tar -xzf "artifacts/humanities-$year-r$region/artifact.tar.gz" -C "staging/humanities/$year"
            done
          done

      - name: Aggregate QA and reports
        shell: bash
        run: |
          set -euo pipefail
          python scripts/extract_kanoon_humanities.py --aggregate --root staging/humanities
          mkdir -p data/raw/kanoon/humanities
          cp -R staging/humanities/1401 data/raw/kanoon/humanities/
          cp -R staging/humanities/1402 data/raw/kanoon/humanities/
          cp -R staging/humanities/1403 data/raw/kanoon/humanities/
          cp -R staging/humanities/1404 data/raw/kanoon/humanities/

      - name: Final validation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          total = 0
          for year in (1401,1402,1403,1404):
              yd = Path(f"data/raw/kanoon/humanities/{year}")
              qa = json.loads((yd/"QA_REPORT.json").read_text(encoding="utf-8"))
              assert qa["status"] == "PASS", qa
              for region in (1,2,3):
                  rows = [json.loads(x) for x in (yd/f"region-{region}.jsonl").read_text(encoding="utf-8").splitlines() if x.strip()]
                  assert rows, (year,region)
                  total += len(rows)
          print("VALIDATION_PASS", total)
          PY

      - name: Commit humanities dataset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/kanoon/humanities reports/data-system/HUMANITIES_*_COMPLETION_REPORT.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: extract Kanoon humanities 1401-1404"
            git push origin HEAD:data/kanoon-humanities-1401-1404-20260928
          fi
