name: Materialize biology science capacities

on:
  push:
    paths:
      - "scripts/materialize_bio_science.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Materialize files
        run: python scripts/materialize_bio_science.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/capacity/normalized/*/capacities-microbiology.csv data/capacity/normalized/*/capacities-cell-molecular-biology.csv data/capacity/MICROBIOLOGY_REPORT.md data/capacity/MICROBIOLOGY_SUMMARY.json data/capacity/CELL_MOLECULAR_BIOLOGY_REPORT.md data/capacity/CELL_MOLECULAR_BIOLOGY_SUMMARY.json
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Add microbiology and cell molecular biology capacities"
          git push
