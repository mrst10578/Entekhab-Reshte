name: Materialize food science veterinary capacity files

on:
  push:
    paths:
      - "scripts/materialize-food-science-vet.py"
      - ".github/workflows/materialize-food-science-vet.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Materialize outputs
        run: python scripts/materialize-food-science-vet.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/capacity/normalized/1401/capacities-food-science-vet-associate-meat-inspection.csv
          git add data/capacity/normalized/1402/capacities-food-science-vet-associate-meat-inspection.csv
          git add data/capacity/normalized/1403/capacities-food-science-vet-associate-meat-inspection.csv
          git add data/capacity/normalized/1404/capacities-food-science-vet-associate-meat-inspection.csv
          git add data/capacity/FOOD_SCIENCE_VET_ASSOCIATE_MEAT_REPORT.md
          git add data/capacity/FOOD_SCIENCE_VET_ASSOCIATE_MEAT_SUMMARY.json
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Add food science and veterinary capacity data"
          git push
