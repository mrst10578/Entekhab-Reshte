name: Import 1405 experimental capacity

on:
  push:
    paths:
      - ".github/workflows/import-capacity-1405.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      BUNDLE_URL: "https://uc86b983db9f329744d6263fda30.dl.dropboxusercontent.com/cd/0/get/DJaCsp_KzsUoNh5zWWAt0LRPWHXlgjA5hh7_vZ1GgYR0ZqSBWmwpiCHRvKoPuv765N-5lpYDVZor9AgxZobA8LeJjFd-6cDHTsaulRWAjYvhb9b1cAqDSzVH58Nx04mLIOYOT2KH3oK3t9woBmKvvuRI6ybA2FATSAzE5pV1hmLhWQ/file?c_luid=e2a8d15f"
    steps:
      - uses: actions/checkout@v4

      - name: Download verified extraction bundle
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "$BUNDLE_URL" -o /tmp/cap1405.zip
          mkdir -p /tmp/cap1405
          unzip -q /tmp/cap1405.zip -d /tmp/cap1405
          test -s /tmp/cap1405/capacities-all.csv
          test -s /tmp/cap1405/summary.json
          test -s /tmp/cap1405/parse_1405_capacity_v3.py

      - name: Install 1405 capacity data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/capacity/normalized/1405 data/capacity/raw/1405 scripts
          cp /tmp/cap1405/capacities-all.csv data/capacity/normalized/1405/capacities-all.csv
          cp /tmp/cap1405/capacities-1405-experimental.csv data/capacity/normalized/1405/capacities-experimental.csv
          cp /tmp/cap1405/summary.json data/capacity/normalized/1405/SUMMARY.json
          cp /tmp/cap1405/unmapped_titles.json data/capacity/normalized/1405/unmapped-nontarget-titles.json
          cp /tmp/cap1405/parse_1405_capacity_v3.py scripts/parse_capacity_1405_experimental.py

          cat > data/capacity/raw/1405/sources.json <<'JSON'
          {
            "year": 1405,
            "group": "experimental",
            "source_id": "1405-booklet",
            "original_name": "Tajrobi.pdf",
            "source_repository_paths": [
              "data/raw/sanjesh/experimental/1405/Tajrobi_part_1.pdf",
              "data/raw/sanjesh/experimental/1405/Tajrobi_part_2.pdf"
            ],
            "pages": 664,
            "sha256_original": "e9f6d83e0be75e62a5b240dfcbf66856ba0d9c575e762a04fbb610b545618756",
            "sha256_parts": {
              "Tajrobi_part_1.pdf": "aa1e065f5434e0fbc2f56ef89b1d9439e4ad72a90a600fb395782f653fcca316",
              "Tajrobi_part_2.pdf": "338857c01260aee0b47be832d8e5ccf96b3eff4a0d550ef96ab3bd9be967bdac"
            },
            "extraction_scope": "Only the 39 experimental-group major families already supported by the capacity explorer are normalized here.",
            "qa": {
              "rows": 3900,
              "unique_course_location_codes": 3900,
              "duplicate_course_location_codes": 0,
              "missing_university": 0,
              "missing_major": 0,
              "total_capacity": 56662
            }
          }
          JSON

          if ! grep -q '^1405-booklet,' data/capacity/raw/sources.csv; then
            printf '%s\n' '1405-booklet,1405,Tajrobi.pdf,booklet,نسخه ارسالی کاربر,e9f6d83e0be75e62a5b240dfcbf66856ba0d9c575e762a04fbb610b545618756,,فایل در ریپو به دو بخش PDF نگهداری می‌شود؛ مسیرها و هش قطعات در raw/1405/sources.json ثبت شده‌اند.' >> data/capacity/raw/sources.csv
          fi

          cat > data/capacity/normalized/1405/EXTRACTION_REPORT.md <<'MD'
          # گزارش ظرفیت ۱۴۰۵ - گروه تجربی

          داده‌های این پوشه از دفترچه انتخاب رشته گروه علوم تجربی سال ۱۴۰۵ استخراج شده‌اند.

          - دامنه: ۳۹ خانواده‌رشته‌ای که ابزار ظرفیت فعلی برای گروه تجربی پشتیبانی می‌کند.
          - ردیف نهایی: ۳۹۰۰
          - مجموع ظرفیت اعلام‌شده: ۵۶۶۶۲
          - کدرشته‌محل یکتا: ۳۹۰۰
          - کدرشته‌محل تکراری: صفر
          - ردیف بدون نام رشته یا دانشگاه: صفر
          - منبع: Tajrobi.pdf، ۶۶۴ صفحه
          - فایل منبع در ریپو به دو بخش نگهداری می‌شود.

          این خروجی فعلاً فقط گروه تجربی ۱۴۰۵ را پوشش می‌دهد. گروه‌های ریاضی و انسانی ۱۴۰۵ تا زمان ورود منبع متناظر، «ثبت نشده» باقی می‌مانند. عنوان‌های خارج از ۳۹ خانواده‌رشته هدف حذف نشده‌اند، بلکه فهرست تشخیصی آن‌ها در `unmapped-nontarget-titles.json` نگهداری می‌شود تا در توسعه بعدی پوشش داده شوند.
          MD

          python - <<'PY'
          from pathlib import Path

          root = Path("README.md")
          text = root.read_text(encoding="utf-8")
          marker = "## ظرفیت ۱۴۰۵ گروه تجربی"
          if marker not in text:
              text += """
          
          ## ظرفیت ۱۴۰۵ گروه تجربی
          
          دفترچه انتخاب رشته گروه تجربی ۱۴۰۵ وارد دیتابیس ظرفیت شد. خروجی فعلی ۳۹۰۰ کدرشته‌محل یکتا در ۳۹ خانواده‌رشته پشتیبانی‌شده ابزار را پوشش می‌دهد و مجموع ظرفیت اعلام‌شده آن‌ها ۵۶۶۶۲ است. پوشش ۱۴۰۵ در این مرحله فقط گروه تجربی است؛ برای ریاضی و انسانی ۱۴۰۵ هنوز داده‌ای ثبت نشده است.
          """
              root.write_text(text, encoding="utf-8")

          cap = Path("data/capacity/README.md")
          text = cap.read_text(encoding="utf-8")
          marker = "## ۱۴۰۵ - گروه تجربی"
          if marker not in text:
              text += """
          
          ## ۱۴۰۵ - گروه تجربی
          
          داده ۱۴۰۵ گروه تجربی از دفترچه `Tajrobi.pdf` اضافه شده است: ۳۹۰۰ کدرشته‌محل یکتا، ۳۹ خانواده‌رشته هدف و مجموع ظرفیت ۵۶۶۶۲. فایل‌های خروجی در `normalized/1405/` قرار دارند. این پوشش فعلاً فقط تجربی است؛ داده ۱۴۰۵ ریاضی و انسانی هنوز وارد نشده است.
          """
              cap.write_text(text, encoding="utf-8")
          PY

      - name: Commit imported data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/capacity/normalized/1405 data/capacity/raw/1405 data/capacity/raw/sources.csv scripts/parse_capacity_1405_experimental.py README.md data/capacity/README.md
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m "data: add 1405 experimental capacity dataset"
          git push
