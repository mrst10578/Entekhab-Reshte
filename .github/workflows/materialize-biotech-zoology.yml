name: Materialize biotech zoology capacity files

on:
  push:
    paths:
      - "scripts/materialize_biotech_zoology.py"
      - ".github/workflows/materialize-biotech-zoology.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Materialize outputs
        run: python scripts/materialize_biotech_zoology.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/capacity/normalized/1401/capacities-biotechnology-zoology.csv
          git add data/capacity/normalized/1402/capacities-biotechnology-zoology.csv
          git add data/capacity/normalized/1403/capacities-biotechnology-zoology.csv
          git add data/capacity/normalized/1404/capacities-biotechnology-zoology.csv
          git add data/capacity/BIOTECHNOLOGY_ZOOLOGY_REPORT.md data/capacity/BIOTECHNOLOGY_ZOOLOGY_SUMMARY.json
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Add biotechnology and zoology capacities"
          git push
