      - name: Validate imported files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          expected_sizes = {
              "data/raw/kanoon/experimental/1401/region-1.jsonl": 961714,
              "data/raw/kanoon/experimental/1401/region-1.manifest.json": 813,
              "data/raw/kanoon/experimental/1401/region-2.jsonl": 3177313,
              "data/raw/kanoon/experimental/1401/region-2.manifest.json": 814,
              "data/raw/kanoon/experimental/1401/region-3.jsonl": 2663038,
              "data/raw/kanoon/experimental/1401/region-3.manifest.json": 814,
              "data/raw/kanoon/experimental/1401/stage-summary.json": 2410,
              "data/raw/kanoon/experimental/1401/QA_REPORT.json": 2105,
              "data/raw/kanoon/experimental/1402/region-1.jsonl": 247510,
              "data/raw/kanoon/experimental/1402/region-1.manifest.json": 833,
              "data/raw/kanoon/experimental/1402/region-2.jsonl": 640352,
              "data/raw/kanoon/experimental/1402/region-2.manifest.json": 874,
              "data/raw/kanoon/experimental/1402/region-3.jsonl": 469118,
              "data/raw/kanoon/experimental/1402/region-3.manifest.json": 874,
              "data/raw/kanoon/experimental/1402/stage-summary.json": 2681,
              "data/raw/kanoon/experimental/1402/QA_REPORT.json": 2621,
              "reports/data-system/EXPERIMENTAL_1401_COMPLETION_REPORT.md": 2983,
              "reports/data-system/EXPERIMENTAL_1402_COMPLETION_REPORT.md": 4126,
          }

          for name, size in expected_sizes.items():
              p = Path(name)
              assert p.exists(), f"missing: {name}"
              assert p.stat().st_size == size, f"size mismatch: {name}: {p.stat().st_size} != {size}"

          expected_counts = {
              "data/raw/kanoon/experimental/1401/region-1.jsonl": 1972,
              "data/raw/kanoon/experimental/1401/region-2.jsonl": 6430,
              "data/raw/kanoon/experimental/1401/region-3.jsonl": 5292,
              "data/raw/kanoon/experimental/1402/region-1.jsonl": 620,
              "data/raw/kanoon/experimental/1402/region-2.jsonl": 1598,
              "data/raw/kanoon/experimental/1402/region-3.jsonl": 1163,
          }

          for name, count in expected_counts.items():
              rows = 0
              with open(name, "r", encoding="utf-8") as fh:
                  for line in fh:
                      if line.strip():
                          json.loads(line)
                          rows += 1
              assert rows == count, f"record mismatch: {name}: {rows} != {count}"

          for p in Path("data/raw/kanoon/experimental").rglob("*.json"):
              json.loads(p.read_text(encoding="utf-8"))

          print("VALIDATION_PASS")
          PY

      - name: Commit dataset and remove transfer workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          git rm .github/workflows/import-kanoon.yml
          git commit -m "data: restore Kanoon experimental 1401-1402"
          git push origin HEAD:data/kanoon-import-actions
