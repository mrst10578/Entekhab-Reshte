name: Materialize radiotherapy dental prosthesis capacity files

on:
  push:
    paths:
      - "scripts/materialize_radiotherapy_dental_prosthesis.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Materialize files
        run: python scripts/materialize_radiotherapy_dental_prosthesis.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/capacity/normalized/*/capacities-radiotherapy-dental-prosthesis.csv data/capacity/RADIOTHERAPY_DENTAL_PROSTHESIS_SUMMARY.json data/capacity/RADIOTHERAPY_DENTAL_PROSTHESIS_REPORT.md
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Add radiotherapy and dental prosthesis capacities for 1401-1404"
          git push
