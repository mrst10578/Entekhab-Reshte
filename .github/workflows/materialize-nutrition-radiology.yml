name: Materialize nutrition and radiology capacity files

on:
  push:
    paths:
      - "scripts/materialize_nutrition_radiology.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Materialize files
        run: python scripts/materialize_nutrition_radiology.py
      - name: Commit generated capacity files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/capacity/normalized/*/capacities-nutrition-radiology.csv data/capacity/NUTRITION_RADIOLOGY_SUMMARY.json data/capacity/NUTRITION_RADIOLOGY_REPORT.md
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Add nutrition and radiology capacities for 1401-1404"
          git push
