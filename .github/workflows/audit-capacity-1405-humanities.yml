name: Audit 1405 humanities capacity

on:
  push:
    paths:
      - ".github/workflows/audit-capacity-1405-humanities.yml"
      - "scripts/audit_capacity_1405_humanities.py"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Run audit
        run: |
          python scripts/audit_capacity_1405_humanities.py
          cat data/capacity/audit/humanities-1405-audit.json | head -80
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/capacity/audit/humanities-1405-audit.json
          git diff --cached --quiet && exit 0
          git commit -m "audit: record humanities 1405 findings"
          git push
